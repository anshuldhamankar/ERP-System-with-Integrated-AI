{% extends 'base.html' %}
{% block title %}Edit Supplier - ERP Lite{% endblock %}

{% block content %}
<div class="container mt-4">
  <h2 class="mb-4">✏️ Edit Supplier: {{ supplier.name }}</h2>

  <div class="card mb-4">
    <div class="card-header">Edit Supplier Details</div>
    <div class="card-body">
      <form method="POST" action="{{ url_for('edit_supplier', supplier_id=supplier.id) }}">
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="name" class="form-label">Supplier Name</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ supplier.name }}" required />
          </div>
          <div class="col-md-6">
            <label for="contact_email" class="form-label">Contact Email</label>
            <input type="email" class="form-control" id="contact_email" name="contact_email" value="{{ supplier.contact_email or '' }}" />
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Update Supplier</button>
        <a href="{{ url_for('suppliers') }}" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
